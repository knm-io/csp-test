log_format  bodied  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" "[$request_body]"';

limit_req_zone "csp" zone=csp:10m rate=1r/s;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        add_header 'Content-Security-Policy' "script-src 'nonce-blarglfarz' 'strict-dynamic'; object-src 'none'; base-uri 'none'; report-to /csp-log; report-uri /csp-log";
        #add_header 'Content-Security-Policy-Report-Only' "script-src 'nonce-blarglfarz' 'strict-dynamic'; object-src 'none'; base-uri 'none'; report-to /csp-log; report-uri /csp-log";
    }

    location /csp-log {
        limit_req zone=csp burst=5 nodelay;

        access_log /var/log/nginx/csp-log.access.log bodied;

        root /usr/share/nginx/lua;
        content_by_lua_file $document_root/csp-log.lua;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}

